<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID-Plastic | Decodificatore Polimeri</title>
    <style>
        :root {
            /* Colori Tema Scuro */
            --bg-color: #0b0d10;
            --surface-color: #161a22;
            --surface-hover: #1e242f;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #14b8a6; 
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --border-color: #2e3440;
            
            /* Colori Polimeri */
            --color-1: #38bdf8; /* PET */
            --color-2: #34d399; /* HDPE */
            --color-3: #f87171; /* PVC */
            --color-4: #fbbf24; /* LDPE */
            --color-5: #a78bfa; /* PP */
            --color-6: #f472b6; /* PS */
            --color-7: #94a3b8; /* OTHER */

            --spacing-sm: 0.75rem;
            --spacing-md: 1.2rem;
            --spacing-lg: 1.8rem;
            --spacing-xl: 2.5rem;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.02em; }
        p { line-height: 1.6; color: var(--text-secondary); }

        header {
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-md) var(--spacing-md);
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 var(--spacing-md) var(--spacing-xl);
            position: relative;
        }

        /* --- Navigazione Viste --- */
        .view {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
        }
        .view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Home: Griglia --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 2.5rem;
            }
            .grid-container .btn-plastic:last-child {
                grid-column: 2;
            }
        }

        .btn-plastic {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .btn-plastic:hover {
            transform: translateY(-5px);
            background-color: var(--surface-hover);
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px -10px rgba(20, 184, 166, 0.15);
        }

        /* Contenitore SVG e Numero */
        .recycle-icon-wrapper {
            position: relative;
            width: 75%;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .recycle-svg {
            position: absolute;
            width: 85%;
            height: 85%;
            object-fit: contain;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }

        .btn-plastic:hover .recycle-svg {
            stroke: var(--accent-color);
        }

        .recycle-number {
            font-size: 2.2rem;
            font-weight: 700;
            z-index: 2;
            position: relative;
            margin-top: 12%;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .acronym {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* --- Pulsanti di Navigazione (Back) --- */
        .btn-back {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: var(--spacing-sm);
            padding: 0.5rem 0;
            transition: color 0.2s;
        }
        .btn-back:hover { color: var(--accent-color); }

        /* --- VISTA 2: Panoramica --- */
        .overview-header {
            text-align: center;
            margin-bottom: var(--spacing-md);
        }
        .overview-header h2 {
            font-size: 2.5rem;
            margin-bottom: 0.2rem;
        }
        .overview-header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .quick-facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: var(--spacing-md);
        }
        .fact-box {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }
        .fact-box h4 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .fact-value {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .fact-safe { color: var(--success-color); }
        .fact-warning { color: var(--warning-color); }
        .fact-danger { color: var(--danger-color); }

        .info-card {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: var(--spacing-lg);
            border-left: 4px solid var(--accent-color);
        }
        .info-card h3 {
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-size: 1.4rem;
        }
        .info-card p {
            margin-bottom: 1rem;
        }
        .info-card p:last-child { margin-bottom: 0; }

        /* --- Nuove Tabelle Storia e Utilizzi --- */
        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }
        .custom-table th {
            background-color: var(--surface-hover);
            color: var(--accent-color);
            text-align: left;
            padding: 0.8rem 1.2rem;
            border-radius: 12px 12px 0 0;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .custom-table td {
            background-color: var(--bg-color);
            padding: 1.2rem;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 12px 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .image-center-placeholder {
            width: 100%;
            height: 180px;
            background-color: var(--surface-hover);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            margin: 1.5rem 0;
            font-size: 0.9rem;
            font-style: italic;
            transition: all 0.3s ease;
        }

        /* Pulsanti Approfondimento */
        .deep-dive-menu {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .btn-deep-dive {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 500;
            text-align: left;
        }
        .btn-deep-dive:hover {
            background-color: var(--surface-hover);
            border-color: var(--accent-color);
            transform: translateX(5px);
        }
        .btn-deep-dive svg {
            color: var(--accent-color);
        }

        /* --- VISTA 3: Dettaglio Singolo (Deep Dive) --- */
        .deep-dive-content {
            background-color: var(--surface-color);
            border-radius: 24px;
            padding: var(--spacing-md);
            border-top: 4px solid var(--accent-color);
        }
        .deep-dive-content h2 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }
        
        .molecule-box {
            width: 100%;
            height: 250px;
            background-color: var(--bg-color);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            margin-top: 1rem;
            font-style: italic;
        }

    
        /* ── OVERVIEW NUOVO LAYOUT ── */
        .overview-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }

        .ov-symbol-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ov-symbol-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ov-symbol-number {
            position: absolute;
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 2;
            margin-top: 8px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        .ov-title-block h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 0.2rem 0;
        }

        .ov-title-block p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 0.8rem 0;
        }

        .two-col-layout {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .col-text {
            flex: 1;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .col-image {
            flex-shrink: 0;
            width: 110px;
            height: 110px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            text-align: center;
        }

        .placeholder-img {
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            color: var(--text-secondary);
        }

        .placeholder-img small {
            font-size: 0.65rem;
            margin-top: 0.3rem;
            line-height: 1.3;
        }

        .tips-row {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .tips-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .tips-row p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .dd-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1.5px solid var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-right: 0.3rem;
        }

        </style>
</head>
<body>

    <header>
        <h1>ID-Plastic</h1>
        <p>Decodificatore interattivo per i 7 codici del riciclo</p>
    </header>

    <main>
        <!-- VISTA 1: LA GRIGLIA -->
        <div id="view-grid" class="view active">
            <div class="grid-container" id="plastic-grid">
                <!-- Generato via JS -->
            </div>
        </div>

        <!-- VISTA 2: PANORAMICA (Overview) -->
        <div id="view-overview" class="view">

            <!-- HEADER: back + triangolo + titolo -->
            <button class="btn-back" onclick="goHome()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Torna ai Codici
            </button>

            <div class="overview-header">
                <div class="ov-symbol-wrapper">
                    <div id="ov-symbol-img"></div>
                    <span id="ov-symbol-number" class="ov-symbol-number"></span>
                </div>
                <div class="ov-title-block">
                    <h2 id="ov-title"></h2>
                    <p id="ov-name"></p>
                </div>
            </div>

            <!-- 3 PILL BUTTONS -->
            <div class="quick-facts">
                <div class="fact-box">
                    <h4>Microonde</h4>
                    <div id="ov-microwave" class="fact-value"></div>
                </div>
                <div class="fact-box">
                    <h4>Riciclo</h4>
                    <div id="ov-recycle" class="fact-value"></div>
                </div>
                <div class="fact-box">
                    <h4>Tossicità Base</h4>
                    <div id="ov-tox-level" class="fact-value"></div>
                </div>
            </div>

            <!-- SEZIONE PANORAMICA: testo sinistra + immagine destra -->
            <div class="info-card">
                <h3 class="section-title">Panoramica</h3>
                <div class="two-col-layout">
                    <p id="ov-panoramica-text" class="col-text"></p>
                    <div class="col-image placeholder-img">📦<br><small>Immagine<br>Panoramica</small></div>
                </div>
            </div>

            <!-- SEZIONE STORIA: testo full width -->
            <div class="info-card">
                <h3 class="section-title">Storia</h3>
                <p id="ov-history-text"></p>
            </div>

            <!-- SEZIONE UTILIZZI: testo sinistra + immagine destra + consigli sotto -->
            <div class="info-card">
                <h3 class="section-title">Utilizzi Principali</h3>
                <div class="two-col-layout">
                    <p id="ov-uses-text" class="col-text"></p>
                    <div class="col-image placeholder-img">🏭<br><small>Immagine<br>Utilizzi</small></div>
                </div>
                <div class="tips-row">
                    <span class="tips-icon">💡</span>
                    <p id="ov-tips"></p>
                </div>
            </div>

            <!-- 3 BOTTONI APPROFONDIMENTO -->
            <div class="deep-dive-menu">
                <button class="btn-deep-dive" onclick="openDeepDive('chimica')">
                    <span class="dd-number">1</span>
                    <span>Decodificatore Molecolare</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <button class="btn-deep-dive" onclick="openDeepDive('tossicita')">
                    <span class="dd-number">2</span>
                    <span>Profilo di Tossicità e Stabilità</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <button class="btn-deep-dive" onclick="openDeepDive('ambiente')">
                    <span class="dd-number">3</span>
                    <span>Passaporto Ambientale</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </div>

        <!-- VISTA 3: APPROFONDIMENTO SINGOLO (Deep Dive) -->
        <div id="view-deep-dive" class="view">
            <button class="btn-back" onclick="backToOverview()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Torna alla Panoramica
            </button>

            <div class="deep-dive-content">
                <h2 id="dd-title">Titolo Sezione</h2>
                <p id="dd-text">Testo approfondito...</p>
                
                <!-- Spazio per molecola (visibile solo nella sezione chimica) -->
                <div id="dd-molecule-box" class="molecule-box" style="display: none;">
                    [Spazio riservato per SVG Struttura Molecolare del Monomero]
                </div>
            </div>
        </div>
    </main>

    <script>
        /**
         * Database Dati (Aggiornato con le info dai PDF)
         */
        const plasticData = {
            1: {
                acronym: "PET",
                name: "Polietilentereftalato",
                color: "var(--color-1)",
                overview: {
                    microwave: "<span class='fact-danger'>Assolutamente No</span>",
                    recycle: "<span class='fact-success'>Molto Facile (Plastica)</span>",
                    toxLevel: "<span class='fact-warning'>Medio (se scaldato)</span>",
                    panoramica: "Il polietilene tereftalato (PET) è una termoplastica poliestere lineare, usata come tecnopolimero per la sua precisione dimensionale e buon comportamento antifrizione. A temperatura ambiente è stabile e può essere amorfo (trasparente) o semicristallino (opaco), il che lo rende adatto a contenitori per alimenti e bevande, fibre tessili (es. Dacron, Tergal) e film/lastre (Mylar, Melinex). Ha buone proprietà elettriche, resistenza chimica, prestazioni a elevate temperature, autoestinguenza e facilità di stampaggio. Si decompone intorno a 450 °C formando composti come acido benzoico, CO2, acetaldeide e CO. Nomi commerciali comuni: Rynite, Ertalyte, Polystar, Sustadur Pet, Mylar.",
                    history: "Il polietilene tereftalato fu inventato nel 1941 da Whinfield e John Rex James Tennant Dickson, che ripresero le precedenti ricerche di Wallace Carothers. Nel 1952 viene registrato il marchio Mylar. Il brevetto delle bottiglie in PET risale al 1973 e appartiene al chimico Nathaniel Wyeth.",
                    uses: "Oltre il 60% della produzione di polietilene tereftalato è destinato alla produzione di fibre e fiocchi, il 30% di bottiglie. Esempi di altre applicazioni sono film (ad esempio Mylar di DuPont), tubi, contenitori, etichette, timpani per strumenti a percussione, pellicole per vetri. È utilizzato inoltre nel nuovo LHC del CERN come isolante tra i magneti (1,9 K) e l'ambiente esterno (293 K).",
                    tips: "Non lasciare mai le bottigliette d'acqua al sole o in auto d'estate: il calore accelera il rilascio di antimonio (un catalizzatore di produzione) e acetaldeide nell'acqua. Evita di riutilizzare all'infinito le bottiglie monouso."
                },
                deepDive: {
                    chimica: {
                        title: "Decodificatore Molecolare",
                        text: "Il PET è un poliestere termoplastico. Viene sintetizzato tramite reazione di policondensazione tra acido tereftalico (o dimetil tereftalato) e glicol etilenico. I gruppi funzionali coinvolti sono i gruppi carbossilici e ossidrilici che formano legami estere, rilasciando acqua o metanolo come sottoprodotto."
                    },
                    tossicita: {
                        title: "Profilo di Tossicità e Stabilità",
                        text: "Chimicamente stabile a temperatura ambiente. Tuttavia, la sua temperatura di transizione vetrosa è relativamente bassa (circa 70-80°C). Se sottoposto a calore (microonde o sole diretto), la matrice polimerica si ammorbidisce e può favorire la migrazione di monomeri non reagiti e metalli pesanti (antimonio) nel cibo o nell'acqua."
                    },
                    ambiente: {
                        title: "Passaporto Ambientale",
                        text: "È uno dei polimeri più riciclati al mondo (viene trasformato in rPET, utilizzato per nuovi imballaggi o per tessuti sintetici come il pile). Tuttavia, se disperso nell'ambiente, non è biodegradabile e impiega centinaia di anni per fotodegradarsi in microplastiche, che si infiltrano nei cicli biologici."
                    }
                }
            },
            2: {
                acronym: "HDPE",
                name: "Polietilene ad alta densità",
                color: "var(--color-2)",
                overview: {
                    microwave: "<span class='fact-safe'>Sì (relativamente sicuro)</span>",
                    recycle: "<span class='fact-success'>Facile (Plastica)</span>",
                    toxLevel: "<span class='fact-safe'>Molto Basso</span>",
                    panoramica: "L’HDPE (Polietilene ad Alta Densità) è uno dei polimeri termoplastici più diffusi e utilizzati al mondo. Si tratta di un polietilene lineare con struttura altamente cristallina, che gli conferisce maggiore rigidità, resistenza meccanica e densità rispetto alle versioni a bassa densità (LDPE). Caratterizzato da eccellente resistenza agli agenti chimici, all’umidità e agli urti, buona impermeabilità e facilità di lavorazione, l’HDPE è particolarmente apprezzato per la sua robustezza e durabilità. Viene impiegato principalmente nella produzione di tubature per acquedotti e gas, serbatoi, contenitori per uso industriale e alimentare, bottiglie, taniche, casse, pallet e film tecnici. Grazie alla sua riciclabilità (codice SPI 2) e al rapporto qualità-prezzo, rappresenta uno dei materiali plastici più sostenibili e versatili nell’industria moderna.",
                    history: "La storia dell'HDPE inizia nel 1956, quando fu sviluppato per la prima volta dalla Phillips Petroleum Company statunitense. Inizialmente il suo impiego fu limitato a causa dei limiti delle tecnologie di lavorazione dell'epoca. Solo negli anni '60 la resina HDPE maturò tecnicamente e iniziò a essere utilizzata per fabbricare tubi e altri prodotti. Negli anni '80 e '90 si ebbero ulteriori sviluppi con l'introduzione del PE80 (migliorata resistenza alla criccatura) e del PE100 con distribuzione bimodale del peso molecolare, che migliorò significativamente la resistenza allo scorrimento e alla pressione, permettendo applicazioni per tubi di grande diametro e alta pressione. Oggi l'HDPE è uno dei polimeri più elaborati e utilizzati globalmente, impiegato in tubi, contenitori, film, isolanti per cavi elettrici e molti altri settori industriali.",
                    uses: "Le principali applicazioni dell'HDPE sono molto varie grazie alla sua resistenza meccanica, rigidità, resistenza chimica e atossicità. Nel settore alimentare è usato per confezioni per latte, flaconi e contenitori per liquidi come succhi di frutta. Nell'industria degli imballaggi troviamo flaconi per detersivi, taniche per carburante, annaffiatoi, tappi e borse di plastica. Nel settore edile è impiegato per tubature di acqua e gas, sistemi di drenaggio e scarico, e geomembrane. Nell'industria chimica serve per componenti resistenti a sostanze aggressive. Viene anche utilizzato per giocattoli, casse, pallet in plastica, mobili, isolatori per cavi e barriere per radici. La sua facilità di riciclaggio e durabilità lo rendono uno dei polimeri più versatili ed ecocompatibili.",

        // Inizializza Griglia
        function initGrid() {
            const gridContainer = document.getElementById('plastic-grid');
            for (let i = 1; i <= 7; i++) {
                const data = plasticData[i];
                const btn = document.createElement('button');
                btn.className = 'btn-plastic';
                btn.innerHTML = `
                    <div class="recycle-icon-wrapper">
                        ${getRecycleSVG(data.color)}
                        <span class="recycle-number" style="color: #ffffff;">${i}</span>
                    </div>
                    <span class="acronym">${data.acronym}</span>
                `;
                btn.onclick = () => openOverview(i);
                gridContainer.appendChild(btn);
            }
        }

        // Funzione Navigazione Fluid
        function switchView(hideEl, showEl) {
            hideEl.style.opacity = '0';
            hideEl.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                hideEl.classList.remove('active');
                hideEl.style.display = 'none'; // FIX: Rimuove fisicamente l'elemento invisibile
                
                showEl.style.display = 'block';
                void showEl.offsetWidth; // force reflow
                
                showEl.classList.add('active');
                showEl.style.opacity = '1';
                showEl.style.transform = 'translateY(0)';
            }, 300);
        }

        // Vai alla Panoramica
        function openOverview(id) {
            currentPlasticId = id;
            const data = plasticData[id];

            // Header: simbolo + numero + titolo
            const symImg = document.getElementById('ov-symbol-img');
            const symNum = document.getElementById('ov-symbol-number');
            symImg.innerHTML = getRecycleSVG(data.color).replace('class="recycle-svg"', 'style="width:70px;height:70px;object-fit:contain;position:absolute;top:0;left:0;"');
            symNum.textContent = id;

            ovTitle.textContent = `${data.acronym}`;
            ovTitle.style.color = data.color;
            ovName.textContent = data.name;

            ovMicrowave.innerHTML = data.overview.microwave;
            ovRecycle.innerHTML = data.overview.recycle;
            ovToxLevel.innerHTML = data.overview.toxLevel;

            const panEl = document.getElementById('ov-panoramica-text');
            if (panEl) panEl.textContent = data.overview.panoramica || '';

            ovHistoryText.textContent = data.overview.history;
            ovUsesText.textContent = data.overview.uses;
            ovTips.textContent = data.overview.tips;

            // Se veniamo dal deep-dive torniamo all'overview, se veniamo dalla grid passiamo all'overview
            if(viewDeepDive.classList.contains('active')) {
                switchView(viewDeepDive, viewOverview);
            } else {
                switchView(viewGrid, viewOverview);
            }
        }

        // Vai all'Approfondimento
        function openDeepDive(sectionKey) {
            const data = plasticData[currentPlasticId].deepDive[sectionKey];
            
            ddTitle.textContent = data.title;
            ddText.innerHTML = data.text.replace(/\n/g, '<br><br>'); // Supporto per a capo
            
            // Mostra il box SVG della molecola solo se siamo nella sezione chimica
            if (sectionKey === 'chimica') {
                ddMoleculeBox.style.display = 'flex';
                // ddMoleculeBox.innerHTML = generateMoleculeSVG(currentPlasticId); // (Futura implementazione vettoriale)
            } else {
                ddMoleculeBox.style.display = 'none';
            }

            switchView(viewOverview, viewDeepDive);
        }

        // Funzioni per pulsanti Back
        function goHome() {
            currentPlasticId = null;
            switchView(viewOverview, viewGrid);
        }

        function backToOverview() {
            openOverview(currentPlasticId);
        }

        // Avvio app
        initGrid();
    </script>
